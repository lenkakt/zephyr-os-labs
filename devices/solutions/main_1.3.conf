#include <zephyr/kernel.h>
#include <zephyr/shell/shell.h>
#include <zephyr/shell/shell_uart.h>
#include <zephyr/sys/printk.h>
#include <stdint.h>   /* uintptr_t */

#define STACK_SIZE   1024
#define PRIORITY     5
#define NUM_THREADS  5
#define DELAY_STEP_MS 1000

K_THREAD_STACK_ARRAY_DEFINE(thread_stacks, NUM_THREADS, STACK_SIZE);
static struct k_thread threads[NUM_THREADS];
static k_tid_t tids[NUM_THREADS];


/* Correct thread signature */
static void thread_fcn(void *p1, void *p2, void *p3)
{
    ARG_UNUSED(p2); ARG_UNUSED(p3);
    int thread_nr = (int)(uintptr_t)p1;

    /* Get the active UART shell backend */
    const struct shell *sh = shell_backend_uart_get_ptr();

    while (1) {
        if (sh) {
            shell_print(sh, "hello from thread nr. %d", thread_nr);
        }
        k_msleep(500);
    }
}

static void create_threads(void)
{
    for (int i = 0; i < NUM_THREADS; i++) {
        tids[i] = k_thread_create(
            &threads[i],
            thread_stacks[i],
            STACK_SIZE,
            thread_fcn,
            (void *)(uintptr_t)i, NULL, NULL,
            PRIORITY,
            0,
            K_MSEC(i * DELAY_STEP_MS));
        k_thread_name_set(tids[i], "sh_printer");
		printk("Created thread %d with delay %d ms\n", i, i * DELAY_STEP_MS);
    }
}

int main(void)
{
    printk("Starting threads....\n");
    /* Give the shell a moment to initialize (optional but helpful) */
    k_msleep(200);
    create_threads();
}
